name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test Dungeon.sln
      # The Godot project is not in Dungeon.sln; compile it so a Core change cannot break it unseen.
      - run: dotnet build dungeon-ttrpg/DungeonTTRPG.csproj
      # The smoke project holds a double field; if it builds, Core is not guarded by the analyzer.
      - name: Analyzer is wired into the build
        shell: bash
        run: |
          set +e
          output=$(dotnet build tests/AnalyzerSmoke/AnalyzerSmoke.csproj 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ] || ! grep -q "error DUN001" <<< "$output"; then
            echo "Analyzer is not wired into the build."
            exit 1
          fi
      - name: Display layer decides no rule
        shell: bash
        run: |
          if grep -rnE "IsWalkable|CheckStep|\.Step\(" dungeon-ttrpg/scripts; then
            echo "Rule logic found in the display layer."
            exit 1
          fi
